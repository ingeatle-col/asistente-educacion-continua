<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente Educación Continua — Javeriana</title>
<style>
  :root{
    --bg:#f7f5f2; --panel:#ffffff; --ink:#1f1b1a; --ink-soft:#5b5450;
    --brand:#7a1f2b; --brand-dark:#5c151f; --brand-soft:#fbe9ea;
    --border:#e7e1db; --bubble-bot:#ffffff; --bubble-user:#7a1f2b; --bubble-user-ink:#ffffff;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161211; --panel:#211c1a; --ink:#f2ece7; --ink-soft:#bfb5ae;
      --brand:#e0808c; --brand-dark:#e0808c; --brand-soft:#3a2226;
      --border:#3a322e; --bubble-bot:#2a2422; --bubble-user:#7a1f2b; --bubble-user-ink:#ffffff;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:720px; margin:0 auto; padding:20px 16px 40px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  header.top{background:linear-gradient(135deg,var(--brand),var(--brand-dark)); color:#fff; padding:18px 20px;}
  header.top h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.2px;}
  header.top p{margin:2px 0 0; font-size:12.5px; opacity:.9;}
  .chat{height:min(62vh,560px); overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; background:var(--bg);}
  .row{display:flex;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}
  .bubble{max-width:82%; padding:10px 13px; border-radius:14px; font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;}
  .row.bot .bubble{background:var(--bubble-bot); border:1px solid var(--border); border-bottom-left-radius:4px;}
  .row.user .bubble{background:var(--bubble-user); color:var(--bubble-user-ink); border-bottom-right-radius:4px;}
  .bubble a{color:inherit; text-decoration:underline;}
  .row.bot .bubble a{color:var(--brand);}
  .typing{display:inline-flex; gap:4px; padding:4px 2px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);opacity:.5;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
  form.inputbar{display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); background:var(--panel);}
  form.inputbar textarea{flex:1; resize:none; border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:14.5px; font-family:inherit; background:var(--bg); color:var(--ink); max-height:120px;}
  form.inputbar textarea:focus{outline:2px solid var(--brand); outline-offset:1px;}
  form.inputbar button{background:var(--brand); color:#fff; border:none; border-radius:12px; padding:0 18px; font-size:14px; font-weight:600; cursor:pointer;}
  form.inputbar button:disabled{opacity:.5; cursor:default;}
  .footer-note{padding:10px 18px 16px; font-size:11.5px; color:var(--ink-soft); text-align:center;}
  .banner{margin:0 0 14px; font-size:12.5px; color:var(--ink-soft); text-align:center;}
</style>
</head>
<body>

<div class="wrap">
  <div class="banner">Asistente de orientación · Educación Continua PUJ</div>
  <div class="card">
    <header class="top">
      <h1>Educación Continua — Asistente virtual</h1>
      <p>Pontificia Universidad Javeriana</p>
    </header>
    <div id="chat" class="chat"></div>
    <form id="inputbar" class="inputbar">
      <textarea id="input" rows="1" placeholder="Escribe tu respuesta..." autocomplete="off"></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
  </div>
  <div class="footer-note" id="footnote">Conversación orientativa para sugerirte programas de Educación Continua.</div>
</div>

<script>
(function(){
  "use strict";

  var CATALOGO = [];
  var CATALOGO_META = { updated_at: null };

  var chatEl = document.getElementById('chat');
  var formEl = document.getElementById('inputbar');
  var inputEl = document.getElementById('input');
  var sendEl = document.getElementById('send');
  var footnote = document.getElementById('footnote');

  var turns = [{role:"user", content: "Inicia SOLO con un saludo breve y cercano (una o dos frases) y de inmediato haz la pregunta 0 (nombre completo y correo electrónico). No agregues nada más."}];

  var state = { step: 0, answers: {}, perfilTexto: "", nombre: "", correo: "", deliverableDone: false };

  function bubble(role, text){
    var row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    var b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = linkify(text);
    row.appendChild(b);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return b;
  }

  function linkify(text){
    var esc = (text||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc.replace(/(https?:\/\/[^\s]+)/g, function(u){
      var clean = u.replace(/[.,;:)]+$/, '');
      return '<a href="'+clean+'" target="_blank" rel="noopener">'+clean+'</a>';
    }).replace(/\n/g,'<br>');
  }

  function typingBubble(){
    var row = document.createElement('div');
    row.className = 'row bot';
    var b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    row.appendChild(b);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return b;
  }

  function setBusy(busy){ sendEl.disabled = busy; inputEl.disabled = busy; }
  function autoGrow(){ inputEl.style.height = 'auto'; inputEl.style.height = Math.min(120, inputEl.scrollHeight) + 'px'; }
  inputEl.addEventListener('input', autoGrow);

  function normaliza(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
  var STOP = new Set(["de","la","el","en","y","a","los","las","un","una","para","con","del","que","es","mi","me","lo","por","su","se","al","como","mas","más","o","tengo","hago","trabajo"]);
  function palabrasClave(texto){ return normaliza(texto).split(/[^a-z0-9]+/).filter(function(w){return w.length>3 && !STOP.has(w);}); }
  function shortlistCatalogo(textoPerfil, max){
    var claves = palabrasClave(textoPerfil);
    var scored = CATALOGO.map(function(p){
      var hay = normaliza(p.titulo + " " + p.tipo);
      var score = 0;
      claves.forEach(function(k){ if(hay.indexOf(k) !== -1) score += 1; });
      return {p:p, score:score};
    });
    scored.sort(function(a,b){ return b.score - a.score || (a.p.fecha_inicio_iso < b.p.fecha_inicio_iso ? -1 : 1); });
    var top = scored.filter(function(s){return s.score>0;}).slice(0, max);
    if(top.length < 12){
      var extra = scored.filter(function(s){return s.score===0;}).slice(0, 12-top.length);
      top = top.concat(extra);
    }
    return top.map(function(s){ return s.p; });
  }
  function catalogoParaPrompt(lista){
    return lista.map(function(p){
      return "- " + p.titulo + " | " + p.tipo + " | inicia " + p.fecha_inicio + " | " + p.duracion + " | " + p.url;
    }).join("\n");
  }

  function contarPreguntaDesdeTexto(texto){
    return normaliza(texto).indexOf("resumen de perfil") !== -1;
  }

  async function llamarBackend(mensajes){
    var resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: mensajes })
    });
    var data = await resp.json().catch(function(){ return {}; });
    if(!resp.ok){
      throw { code: "http_" + resp.status, message: data && data.message };
    }
    return data.text || "";
  }

  function copyError(e){
    if(e && e.code === "http_429") return "Estamos recibiendo muchas conversaciones a la vez. ¿Puedes intentar de nuevo en un momento?";
    if(e && String(e.code||"").indexOf("http_5") === 0) return "Tuve un problema técnico para responder. ¿Puedes intentar de nuevo?";
    return "No pude conectarme en este momento. Intenta de nuevo en unos segundos.";
  }

  async function pedirRespuesta(extraUserSuffix){
    var typingEl = typingBubble();
    setBusy(true);
    if(extraUserSuffix){
      turns[turns.length-1].content += extraUserSuffix;
    }
    try{
      var text = await llamarBackend(turns);
      turns.push({role:"assistant", content: text});
      typingEl.innerHTML = linkify(text);
      if(contarPreguntaDesdeTexto(text)) state.deliverableDone = true;
      chatEl.scrollTop = chatEl.scrollHeight;
    }catch(e){
      typingEl.innerHTML = linkify(copyError(e));
    }finally{
      setBusy(false);
      inputEl.focus();
    }
  }

  async function enviarMensaje(texto){
    if(!texto.trim()) return;
    bubble('user', texto);

    if(state.step === 0){
      var m = texto.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
      if(m) state.correo = m[0];
      state.nombre = texto.replace(m ? m[0] : "", "").replace(/[,;:-]+$/,'').trim() || state.nombre;
    }
    state.answers["p"+state.step] = texto;
    state.perfilTexto += " " + texto;
    state.step = Math.min(state.step + 1, 5);

    turns.push({role:"user", content: texto});

    if(state.step === 5 && !state.deliverableDone){
      var lista = shortlistCatalogo(state.perfilTexto, 22);
      var bloque = "\n\n[CATALOGO_VIGENTE - oferta abierta verificada, usa SOLO estos programas]\n" + catalogoParaPrompt(lista) +
        "\n\nCon la información de todas las respuestas anteriores, genera ahora el ENTREGABLE completo en el formato indicado, y después, en el MISMO mensaje, agrega el párrafo de cierre invitando a inscribirse y preguntando si desea que lo contactemos por WhatsApp.";
      await pedirRespuesta(bloque);
    } else {
      await pedirRespuesta(null);
    }
  }

  formEl.addEventListener('submit', function(ev){
    ev.preventDefault();
    var texto = inputEl.value;
    inputEl.value = '';
    autoGrow();
    enviarMensaje(texto);
  });
  inputEl.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); formEl.requestSubmit(); }
  });

  async function cargarCatalogo(){
    try{
      var resp = await fetch('/catalogo.json', { cache: 'no-store' });
      if(resp.ok){
        var data = await resp.json();
        if(data && Array.isArray(data.programas)){
          CATALOGO = data.programas;
          CATALOGO_META = { updated_at: data.updated_at || null };
        }
      }
    }catch(e){ /* seguimos sin catálogo si falla */ }
  }

  async function init(){
    await cargarCatalogo();
    footnote.textContent = "Oferta verificada el " + (CATALOGO_META.updated_at || "—") + " (" + CATALOGO.length + " programas vigentes). Conversación orientativa.";
    pedirRespuesta(null);
  }
  init();
})();
</script>
</body>
</html>
